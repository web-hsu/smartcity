<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart City Hulu Sungai Utara</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#020b1a; --panel:rgba(4,30,66,.80); --panel2:rgba(8,48,102,.55);
      --line:#1d6fd6; --cyan:#27d3ff; --cyan-soft:rgba(39,211,255,.16);
      --gold1:#ffd24a; --gold2:#f08a00; --txt:#e8f4ff; --muted:#8fb4d9;
      --top:64px; --dock:64px; --pw:340px;
      --font:"Rajdhani","Segoe UI",Arial,sans-serif; --font-title:"Orbitron","Rajdhani",Arial,sans-serif;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow:hidden}
    body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:15px}
    button{font-family:inherit;color:inherit}
    svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

    /* ================= PETA ================= */
    #map{position:fixed;inset:0;background:#06142b}
    .leaflet-container{font-family:var(--font)}
    .leaflet-control-attribution{background:rgba(2,11,26,.7)!important;color:var(--muted)!important;font-size:10px}
    .leaflet-control-attribution a{color:var(--cyan)!important}
    .leaflet-bar{border:1px solid var(--line)!important;box-shadow:none!important}
    .leaflet-bar a{background:var(--panel)!important;color:var(--cyan)!important;border-bottom:1px solid var(--line)!important}
    .leaflet-bottom.leaflet-left{left:calc(var(--pw) + 28px);bottom:calc(var(--dock) + 22px)}
    .kml-kecamatan-label{background:transparent!important;border:0!important;white-space:nowrap;pointer-events:none!important}
    .kml-kecamatan-label span{display:block;transform:translate(-50%,-50%);color:#fff;font-size:13px;font-weight:700;letter-spacing:.3px;line-height:1.1;
      text-shadow:0 0 3px #000,0 0 3px #000,0 0 6px rgba(0,0,0,.9),0 0 10px rgba(39,211,255,.5)}
    .kml-kecamatan-label.aktif span{color:var(--gold1)}
    body.tanpa-label .kml-kecamatan-label{display:none}

    /* ================= HEADER ================= */
    .topbar{position:fixed;z-index:1000;left:0;right:0;top:0;height:var(--top);display:flex;align-items:flex-start;justify-content:space-between;
      padding:0 14px;background:linear-gradient(#020b1a 0,rgba(2,11,26,.88) 62%,rgba(2,11,26,0));pointer-events:none}
    .topbar>*{pointer-events:auto}
    .grup-kanan{display:flex;align-items:flex-start;gap:14px}
    .nav{display:flex;gap:6px;margin-top:10px;align-items:center}
    .nav-btn{position:relative;display:flex;align-items:center;gap:7px;height:36px;padding:0 20px 0 16px;border:0;cursor:pointer;
      font-size:15px;font-weight:700;letter-spacing:.4px;color:#cfe6ff;white-space:nowrap;
      background:linear-gradient(180deg,rgba(14,70,150,.85),rgba(5,32,76,.9));
      clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);transition:.2s}
    .nav-btn::before{content:"";position:absolute;inset:0;border-bottom:2px solid var(--line)}
    .nav-btn:hover{color:#fff;background:linear-gradient(180deg,rgba(25,100,200,.95),rgba(8,45,100,.95))}
    .nav-btn.aktif{color:#2a1700;background:linear-gradient(180deg,var(--gold1),var(--gold2))}
    .nav-btn.aktif::before{border-color:#fff3b0}
    .nav-btn .ic{font-size:17px}
    .judul{position:absolute;left:50%;top:0;transform:translateX(-50%);width:min(520px,36vw);height:58px;text-align:center;pointer-events:none;
      background:linear-gradient(180deg,rgba(18,92,190,.95),rgba(5,36,86,.95));
      clip-path:polygon(0 0,100% 0,calc(100% - 34px) 100%,34px 100%);padding-top:6px}
    .judul::after{content:"";position:absolute;left:34px;right:34px;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--cyan),transparent)}
    .judul h1{margin:0;font-family:var(--font-title);font-weight:800;font-size:clamp(15px,1.7vw,24px);letter-spacing:3px;
      text-shadow:0 0 14px rgba(39,211,255,.8)}
    .judul p{margin:2px 0 0;font-size:clamp(10px,.9vw,13px);letter-spacing:3px;color:#b9dcff;font-weight:600}
    .jam{display:flex;align-items:center;gap:10px;margin-top:10px;text-align:right;line-height:1.1}
    .jam b{display:block;font-family:var(--font-title);font-size:17px;font-weight:600;color:#fff}
    .jam small{color:var(--muted);font-size:12px}

    /* ================= PANEL KIRI / KANAN ================= */
    .panel{position:fixed;z-index:900;top:calc(var(--top) + 16px);bottom:calc(var(--dock) + 16px);width:var(--pw);display:flex;flex-direction:column;gap:12px;
      overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;transition:transform .3s ease,opacity .3s}
    .panel-kiri{left:14px}.panel-kanan{right:14px}
    body.panel-tutup .panel-kiri{transform:translateX(-120%);opacity:0;pointer-events:none}
    body.panel-tutup .panel-kanan{transform:translateX(120%);opacity:0;pointer-events:none}
    body.panel-tutup{--pw:0px}
    .kartu{position:relative;background:var(--panel);border:1px solid rgba(29,111,214,.8);
      box-shadow:inset 0 0 22px rgba(29,111,214,.28),0 6px 24px rgba(0,0,0,.45);backdrop-filter:blur(3px);padding:12px 14px}
    .kartu::before,.kartu::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--cyan)}
    .kartu::before{left:-2px;top:-2px;border-right:0;border-bottom:0}
    .kartu::after{right:-2px;bottom:-2px;border-left:0;border-top:0}
    .kartu-judul{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font-size:18px;font-weight:700;letter-spacing:.5px}
    .kartu-judul::before{content:"";width:4px;height:16px;background:linear-gradient(var(--cyan),var(--line));align-self:center}
    .kartu-judul small{font-size:11px;font-style:italic;letter-spacing:1.4px;color:var(--cyan);text-decoration:underline;text-underline-offset:3px;text-transform:uppercase}

    .tile-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .tile{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border:1px solid rgba(29,111,214,.55)}
    .tile .ic{font-size:26px;color:var(--cyan);padding:6px;border-radius:50%;background:var(--cyan-soft);box-sizing:content-box}
    .tile b{display:block;font-family:var(--font-title);font-size:20px;line-height:1.1;color:#fff}
    .tile span{font-size:12px;color:var(--muted);letter-spacing:.3px}

    .daftar{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
    .daftar button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;cursor:pointer;
      background:var(--panel2);border:1px solid rgba(29,111,214,.5);transition:.2s;font-size:15px;font-weight:600}
    .daftar button:hover{background:rgba(25,100,200,.55);border-color:var(--cyan)}
    .daftar button.aktif{border-color:var(--gold1);background:linear-gradient(90deg,rgba(240,138,0,.35),rgba(8,48,102,.55))}
    .daftar .ic{font-size:19px;color:var(--cyan)}
    .daftar button.aktif .ic{color:var(--gold1)}
    .daftar .ket{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:1px}
    .tag{margin-left:auto;flex:none;font-size:10.5px;letter-spacing:.8px;padding:2px 7px;border:1px solid rgba(143,180,217,.5);color:var(--muted);text-transform:uppercase}
    .catatan{margin:10px 0 0;font-size:12.5px;color:var(--muted);line-height:1.4}

    .grid-bidang{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .grid-bidang button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;cursor:pointer;
      background:var(--panel2);border:1px solid rgba(29,111,214,.55);font-size:14px;font-weight:700;transition:.2s}
    .grid-bidang button:hover{border-color:var(--cyan);background:rgba(25,100,200,.55)}
    .grid-bidang .ic{font-size:26px;color:var(--cyan)}

    .kosong{display:flex;align-items:center;justify-content:center;text-align:center;height:150px;padding:10px;color:var(--muted);font-size:13.5px;line-height:1.4;
      border:1px dashed rgba(143,180,217,.4);background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(29,111,214,.08) 10px 20px)}

    /* ================= DOCK BAWAH ================= */
    .dock{position:fixed;z-index:1000;left:50%;bottom:0;transform:translateX(-50%);display:flex;gap:4px;padding:8px 26px 6px;
      background:linear-gradient(180deg,rgba(8,48,102,.92),rgba(3,22,52,.96));border-top:2px solid var(--cyan);
      clip-path:polygon(0 100%,26px 0,calc(100% - 26px) 0,100% 100%);box-shadow:0 -4px 24px rgba(39,211,255,.2)}
    .dock button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px;padding:6px 10px;border:0;background:transparent;cursor:pointer;
      font-size:13px;font-weight:700;color:#bcd9f7;transition:.2s}
    .dock button .ic{font-size:22px}
    .dock button:hover{color:#fff}
    .dock button.aktif{color:#2a1700;background:linear-gradient(180deg,var(--gold1),var(--gold2));clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}

    /* popover layer */
    .popover{position:fixed;z-index:1100;left:50%;bottom:calc(var(--dock) + 10px);transform:translateX(-50%);width:280px;display:none}
    .popover.tampil{display:block}
    .popover label{display:flex;align-items:center;gap:9px;padding:6px 2px;cursor:pointer;font-size:15px;font-weight:600}
    .popover input{accent-color:var(--cyan);width:16px;height:16px}
    .popover h3{margin:8px 0 2px;font-size:12px;letter-spacing:1.4px;color:var(--cyan);text-transform:uppercase}
    .popover h3:first-child{margin-top:0}

    /* legenda */
    .legenda{position:fixed;z-index:800;right:calc(var(--pw) + 28px);bottom:calc(var(--dock) + 22px);padding:8px 12px;background:var(--panel);border:1px solid var(--line);
      font-size:12.5px;display:flex;flex-direction:column;gap:5px}
    .legenda span{display:flex;align-items:center;gap:8px}
    .legenda i{display:inline-block;width:26px;height:0}
    .l-kab{border-top:3px solid var(--cyan)}
    .l-kec{border-top:2px dashed #7fb6ff}

    /* ================= HP / LAYAR SEMPIT ================= */
    @media(max-width:1760px){
      .nav-btn{padding:0 14px 0 12px}
      .nav-btn .tx{display:none}
      .nav-btn.aktif .tx{display:inline}
      .judul{width:min(440px,30vw)}
    }
    @media(max-width:1100px){
      :root{--pw:300px}
      .nav-btn{padding:0 10px 0 8px}
      .judul{width:min(360px,30vw)}
      .judul p{letter-spacing:1px}
    }
    @media(max-width:820px){
      :root{--top:104px;--pw:0px}
      body{font-size:14px}
      .topbar{flex-wrap:wrap;padding:0 8px}
      .judul{position:static;transform:none;width:auto;flex:1 1 100%;order:-1;height:46px;clip-path:none;padding-top:4px;margin:0 -8px}
      .judul::after{left:0;right:0}
      .nav{margin-top:8px}
      .nav.kiri{order:1;flex:1 1 100%;overflow-x:auto}
      .grup-kanan{order:2;flex:1 1 100%;min-width:0}
      .nav.kanan{overflow-x:auto}
      .nav-btn .tx{display:inline}
      .nav-btn{flex:none;height:30px}
      .jam{display:none}
      :root{--top:132px}
      .panel-kanan,.legenda{display:none}
      .panel-kiri{left:8px;right:8px;width:auto;top:auto;bottom:calc(var(--dock) + 8px);max-height:42vh}
      body.panel-tutup .panel-kiri{transform:translateY(120%)}
      .dock{width:100%;left:0;transform:none;clip-path:none;justify-content:space-around;padding:6px 4px}
      .dock button{min-width:0;flex:1;font-size:11.5px}
      .leaflet-bottom.leaflet-left{left:8px;bottom:calc(var(--dock) + 24px)}
      body:not(.panel-tutup) .leaflet-bottom.leaflet-left{display:none}
      .popover{width:min(300px,92vw)}
    }
  </style>
</head>
<body>

<div id="map" aria-label="Peta Kabupaten Hulu Sungai Utara"></div>

<!-- ============ HEADER & MENU ATAS ============ -->
<header class="topbar">
  <nav class="nav kiri" id="navKiri" aria-label="Menu bidang (kiri)"></nav>
  <div class="judul">
    <h1>SMART CITY</h1>
    <p>KABUPATEN HULU SUNGAI UTARA</p>
  </div>
  <div class="grup-kanan">
    <nav class="nav kanan" id="navKanan" aria-label="Menu bidang (kanan)"></nav>
    <div class="jam"><div><b id="jam">--:--:--</b><small id="tgl">-</small></div></div>
  </div>
</header>

<!-- ============ PANEL KIRI & KANAN ============ -->
<aside class="panel panel-kiri" id="panelKiri" aria-live="polite"></aside>
<aside class="panel panel-kanan" id="panelKanan" aria-live="polite"></aside>

<div class="legenda">
  <span><i class="l-kab"></i> Batas Kabupaten</span>
  <span><i class="l-kec"></i> Batas Kecamatan</span>
</div>

<!-- ============ POPOVER LAYER ============ -->
<div class="popover kartu" id="popLayer">
  <h3>Peta Dasar</h3>
  <label><input type="radio" name="dasar" value="gelap" checked> Gelap</label>
  <label><input type="radio" name="dasar" value="satelit"> Citra Satelit</label>
  <label><input type="radio" name="dasar" value="standar"> Standar (OSM)</label>
  <h3>Lapisan</h3>
  <label><input type="checkbox" id="cbKab" checked> Batas Kabupaten</label>
  <label><input type="checkbox" id="cbKec" checked> Batas Kecamatan</label>
  <label><input type="checkbox" id="cbLabel" checked> Nama Kecamatan</label>
</div>

<!-- ============ DOCK BAWAH ============ -->
<nav class="dock" aria-label="Menu peta">
  <button type="button" id="dkBeranda" class="aktif"><svg class="ic"><use href="#i-home"/></svg>Beranda</button>
  <button type="button" id="dkLayer"><svg class="ic"><use href="#i-layers"/></svg>Layer</button>
  <button type="button" id="dkPanel"><svg class="ic"><use href="#i-panel"/></svg>Panel</button>
  <button type="button" id="dkFull"><svg class="ic"><use href="#i-expand"/></svg>Layar Penuh</button>
</nav>

<!-- ============ IKON ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>

    <symbol id="i-edu" viewBox="0 0 24 24"><path d="M22 10L12 5 2 10l10 5 10-5zM6 12v5c3 2 9 2 12 0v-5"/></symbol>

    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 4 13c0-6 6-9 16-10 0 10-3 17-9 17zM4 21c3-6 6-9 10-11"/></symbol>
    <symbol id="i-bus" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="14" rx="2"/><path d="M4 11h16M7 21v-4M17 21v-4M8 14h.01M16 14h.01"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3L2 21h20L12 3zM12 10v5M12 18v.01"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 2l10 5-10 5L2 7l10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M9 4v16M15 4v16"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-item" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12h8M12 8v8"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 3L3 5v16l6-2 6 2 6-2V3l-6 2-6-2zM9 3v16M15 5v16"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v18h18M7 15l4-4 3 3 5-6"/></symbol>
  </defs>
</svg>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

  // lapisan lebar tembus pandang = efek menyala, lalu garis tegas di atasnya
  L.polygon(cincin(f), { color: "#27d3ff", weight: 9, opacity: .18, fillColor: "#27d3ff", fillOpacity: .06, interactive: false }).addTo(lapKabupaten);
  L.polygon(cincin(f), { color: "#27d3ff", weight: 3, opacity: 1, fill: false, interactive: false }).addTo(lapKabupaten);
});
lapKabupaten.addTo(map);
const batasKabupaten = L.polygon(cincin(fitur("kabupaten")[0]), { stroke: false, fill: false, interactive: false });

const lapKecamatan = L.layerGroup();
const poligonKec = {};
const GAYA_KEC = { color: "#7fb6ff", weight: 1.5, opacity: .9, dashArray: "6 4", fillColor: "#27d3ff", fillOpacity: 0 };
fitur("kecamatan").forEach(f => {
  const p = L.polygon(cincin(f), GAYA_KEC).addTo(lapKecamatan);
  poligonKec[f.properties.name] = p;
  p.on("mouseover", () => { if (kecAktif !== f.properties.name) p.setStyle({ fillOpacity: .18 }); });
  p.on("mouseout", () => { if (kecAktif !== f.properties.name) p.setStyle({ fillOpacity: 0 }); });
  p.on("click", () => pilihKecamatan(f.properties.name));
});
lapKecamatan.addTo(map);

function paskanKabupaten(animasi) {
  map.invalidateSize({ pan: false });
  const sempit = window.innerWidth <= 820;
  const kiri = sempit || document.body.classList.contains("panel-tutup") ? 20 : 372;
  const kanan = sempit || document.body.classList.contains("panel-tutup") ? 20 : 372;
  map.fitBounds(batasKabupaten.getBounds(), {
    paddingTopLeft: [kiri, sempit ? 150 : 90], paddingBottomRight: [kanan, sempit ? 200 : 90],
    maxZoom: 13, animate: !!animasi
  });
}

// ---------- Label kecamatan (diatur otomatis agar tidak saling menimpa) ----------
const labelKecamatan = [];

// Murni hitungan: items = [{x,y,w,h}] (piksel layar) -> offset [{dx,dy}] tanpa tumpang tindih.
function susunLabel(items) {
  const GAP = 3, terpasang = [], hasil = [];
  const tabrak = (a, b) =>
    Math.abs(a.x - b.x) < (a.w + b.w) / 2 + GAP && Math.abs(a.y - b.y) < (a.h + b.h) / 2 + GAP;
  items.forEach(it => {
    const h = it.h + GAP;
    // Coba geser sedikit ke segala arah; ambil yang paling dekat dengan posisi asal.
    const kandidat = [[0, 0]];
    for (let r = 1; r <= 4; r++) {
      [-1, 0, 1].forEach(iy => [-2, -1, 0, 1, 2].forEach(ix => {
        if (iy === 0 && ix === 0) return;
        kandidat.push([ix * r * 22, iy * r * h]);
      }));
    }
    kandidat.sort((a, b) => Math.hypot(a[0], a[1]) - Math.hypot(b[0], b[1]));
    let pilih = kandidat[0];
    for (const [dx, dy] of kandidat) {
      const box = { x: it.x + dx, y: it.y + dy, w: it.w, h: it.h };
      if (!terpasang.some(t => tabrak(box, t))) { pilih = [dx, dy]; break; }
    }
    terpasang.push({ x: it.x + pilih[0], y: it.y + pilih[1], w: it.w, h: it.h });
    hasil.push({ dx: pilih[0], dy: pilih[1] });
  });
  return hasil;
}

function aturLabelKecamatan() {
  if (!labelKecamatan.length) return;
  const font = window.innerWidth <= 820 ? 11 : 13;
  const ctx = document.createElement("canvas").getContext("2d");
  ctx.font = "700 " + font + "px Rajdhani, Arial";
  const items = labelKecamatan.map(l => {
    const p = map.latLngToContainerPoint([l.lat, l.lon]);
    return { x: p.x, y: p.y, w: ctx.measureText(l.name).width + 6, h: font + 4 };
  });
  const urut = items.map((_, i) => i).sort((i, j) => items[i].y - items[j].y || items[i].x - items[j].x);
  const off = susunLabel(urut.map(i => items[i]));
  urut.forEach((i, k) => {
    const el = labelKecamatan[i].marker.getElement();
    if (!el || !el.firstChild) return;
    el.firstChild.style.fontSize = font + "px";
    el.firstChild.style.transform = "translate(-50%,-50%) translate(" + off[k].dx + "px," + off[k].dy + "px)";
  });
}

function muatLabelKecamatan() {
  LABEL_KECAMATAN_HSU.forEach(item => {
    const marker = L.marker([Number(item.lat), Number(item.lon)], {
      icon: L.divIcon({ className: "kml-kecamatan-label", html: "<span>" + esc(item.name) + "</span>", iconSize: [1, 1], iconAnchor: [0, 0] }),
      interactive: false, keyboard: false, zIndexOffset: 1000
    }).addTo(map);
    labelKecamatan.push({ name: item.name, lat: Number(item.lat), lon: Number(item.lon), marker: marker });
  });
  map.on("zoomend moveend", aturLabelKecamatan);
  aturLabelKecamatan();
}

// ---------- Status tampilan ----------
let bidangAktif = null;   // id bidang, null = Beranda
let modulAktif = null;    // indeks modul di bidang aktif
let kecAktif = null;      // nama kecamatan terpilih

function pilihKecamatan(nama) {
  kecAktif = (kecAktif === nama) ? null : nama;
  Object.keys(poligonKec).forEach(n => poligonKec[n].setStyle(n === kecAktif
    ? { color: "#ffd24a", weight: 2.5, dashArray: null, fillColor: "#ffd24a", fillOpacity: .15 } : GAYA_KEC));
  labelKecamatan.forEach(l => { const el = l.marker.getElement(); if (el) el.classList.toggle("aktif", l.name === kecAktif); });
  if (kecAktif) map.flyToBounds(poligonKec[kecAktif].getBounds(), {
    paddingTopLeft: [window.innerWidth <= 820 ? 20 : 372, 100], paddingBottomRight: [window.innerWidth <= 820 ? 20 : 372, 100], maxZoom: 13, duration: .8 });
  else paskanKabupaten(true);
  gambarPanel();
}

function pilihBidang(id) {
  bidangAktif = (bidangAktif === id) ? null : id;
  modulAktif = null;
  gambarMenu();
  gambarPanel();
  $("dkBeranda").classList.toggle("aktif", bidangAktif === null);
  if (document.body.classList.contains("panel-tutup")) document.body.classList.remove("panel-tutup");
}

function beranda() {
  bidangAktif = null; modulAktif = null;
  if (kecAktif) { kecAktif = null; Object.keys(poligonKec).forEach(n => poligonKec[n].setStyle(GAYA_KEC)); labelKecamatan.forEach(l => { const el = l.marker.getElement(); if (el) el.classList.remove("aktif"); }); }
  gambarMenu(); gambarPanel(); paskanKabupaten(true);
  $("dkBeranda").classList.add("aktif");
}

// ---------- Menu atas ----------
function gambarMenu() {
  const buat = sisi => BIDANG.filter(b => b.sisi === sisi).map(b =>
    '<button type="button" class="nav-btn' + (b.id === bidangAktif ? " aktif" : "") + '" data-bidang="' + b.id + '" title="' + esc(b.nama) + '">' +
    ikon(b.ikon) + '<span class="tx">' + esc(b.nama) + '</span></button>').join("");
  $("navKiri").innerHTML = buat("kiri");
  $("navKanan").innerHTML = buat("kanan");
  $("dkBeranda").classList.toggle("aktif", bidangAktif === null);
}

// ---------- Panel ----------
function ubinKosong(ikonId, label) {
  return '<div class="tile">' + ikon(ikonId) + '<div><b>—</b><span>' + esc(label) + '</span></div></div>';
}

function gambarPanel() {
  const kiri = $("panelKiri"), kanan = $("panelKanan");

  if (!bidangAktif) {
    // ===== BERANDA =====
    kiri.innerHTML =
      '<section class="kartu"><h2 class="kartu-judul">Profil Wilayah <small>Ringkasan</small></h2>' +
        '<div class="tile-row">' + 
          '<div class="tile">' + ikon("i-map") + '<div><b>' + LABEL_KECAMATAN_HSU.length + '</b><span>Kecamatan</span></div></div>' +
          '<div class="tile">' + ikon("i-layers") + '<div><b>' + BIDANG.length + '</b><span>Bidang Smart City</span></div></div>' +
        '</div></section>' +
      '<section class="kartu"><h2 class="kartu-judul">Kecamatan <small>Pilih untuk zoom</small></h2><ul class="daftar">' +
        LABEL_KECAMATAN_HSU.slice().sort((a, b) => a.name.localeCompare(b.name)).map(k =>
          '<li><button type="button" data-kec="' + esc(k.name) + '" class="' + (k.name === kecAktif ? "aktif" : "") + '">' +
          ikon("i-pin") + '<span>' + esc(k.name) + '</span></button></li>').join("") +
      '</ul></section>';
    kanan.innerHTML =
      '<section class="kartu"><h2 class="kartu-judul">Bidang Smart City <small>Menu</small></h2><div class="grid-bidang">' +
        BIDANG.map(b => '<button type="button" data-bidang="' + b.id + '">' + ikon(b.ikon) + esc(b.nama) + '</button>').join("") +
      '</div><p class="catatan">Pilih salah satu bidang untuk melihat modul dan indikatornya. Data akan dihubungkan bertahap.</p></section>';
    return;
  }

  // ===== BIDANG TERPILIH =====
  const b = BIDANG.find(x => x.id === bidangAktif);
  kiri.innerHTML =
    '<section class="kartu"><h2 class="kartu-judul">' + esc(b.nama) + ' <small>Modul</small></h2><ul class="daftar">' +
      b.modul.map((m, i) =>
        '<li><button type="button" data-modul="' + i + '" class="' + (i === modulAktif ? "aktif" : "") + '">' + ikon("i-item") +
        '<span>' + esc(m[0]) + '<span class="ket">' + esc(m[1]) + '</span></span><span class="tag">Segera</span></button></li>').join("") +
    '</ul><p class="catatan">Modul ditambahkan bertahap seiring data terhubung.</p></section>';

  const judulModul = modulAktif !== null ? b.modul[modulAktif][0] : b.nama;
  kanan.innerHTML =
    '<section class="kartu"><h2 class="kartu-judul">Indikator Utama <small>' + esc(judulModul) + '</small></h2>' +
      '<div class="tile-row">' + ubinKosong("i-chart", "Indikator 1") + ubinKosong("i-chart", "Indikator 2") +
      ubinKosong("i-chart", "Indikator 3") + ubinKosong("i-chart", "Indikator 4") + '</div></section>' +
    '<section class="kartu"><h2 class="kartu-judul">Grafik <small>Tren</small></h2>' +
      '<div class="kosong">Data belum terhubung.<br>Grafik akan tampil di sini setelah sumber data siap.</div></section>';
}

// ---------- Interaksi ----------
document.addEventListener("click", e => {
  const bd = e.target.closest("[data-bidang]");
  if (bd) { pilihBidang(bd.dataset.bidang); return; }
  const kc = e.target.closest("[data-kec]");
  if (kc) { pilihKecamatan(kc.dataset.kec); return; }
  const md = e.target.closest("[data-modul]");
  if (md) { modulAktif = (modulAktif === Number(md.dataset.modul)) ? null : Number(md.dataset.modul); gambarPanel(); return; }
  if (!e.target.closest("#popLayer") && !e.target.closest("#dkLayer")) $("popLayer").classList.remove("tampil");
});

$("dkBeranda").addEventListener("click", beranda);
$("dkLayer").addEventListener("click", () => {
  const pop = $("popLayer"); pop.classList.toggle("tampil"); $("dkLayer").classList.toggle("aktif", pop.classList.contains("tampil"));
});
$("dkPanel").addEventListener("click", () => {
  document.body.classList.toggle("panel-tutup");
  setTimeout(() => { paskanKabupaten(true); aturLabelKecamatan(); }, 320);
});
$("dkFull").addEventListener("click", () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  } catch (_) {}
});

document.querySelectorAll('input[name="dasar"]').forEach(r => r.addEventListener("change", () => {
  map.removeLayer(PETA_DASAR[dasarAktif]); dasarAktif = r.value; PETA_DASAR[dasarAktif].addTo(map).bringToBack();
}));
function sakelar(cb, aksi) { $(cb).addEventListener("change", e => aksi(e.target.checked)); }
sakelar("cbKab", on => on ? lapKabupaten.addTo(map) : map.removeLayer(lapKabupaten));
sakelar("cbKec", on => on ? lapKecamatan.addTo(map) : map.removeLayer(lapKecamatan));
sakelar("cbLabel", on => document.body.classList.toggle("tanpa-label", !on));

// ---------- Jam (WITA) ----------
function ketukJam() {
  const d = new Date();
  $("jam").textContent = d.toLocaleTimeString("id-ID", { timeZone: "Asia/Makassar", hour12: false }).replace(/\./g, ":");
  $("tgl").textContent = d.toLocaleDateString("id-ID", { timeZone: "Asia/Makassar", weekday: "long", day: "2-digit", month: "long", year: "numeric" }) + " WITA";
}

// ---------- Mulai ----------
function init() {
  gambarMenu(); gambarPanel();
  muatLabelKecamatan();
  paskanKabupaten(false);
  ketukJam(); setInterval(ketukJam, 1000);
  window.addEventListener("resize", () => { paskanKabupaten(false); aturLabelKecamatan(); });
  setTimeout(() => { paskanKabupaten(false); aturLabelKecamatan(); }, 300);
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
</script>
</body>
</html>
